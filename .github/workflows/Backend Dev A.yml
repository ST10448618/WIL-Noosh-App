name: CI Pipeline

on:
  push:
    branches: [ main, develop, backend/menu-catering-careers, frontend/rewards-staff-admin, frontend/public-pages, backend/rewards-auth-infra ]
  pull_request:
    branches: [ main, develop, backend/menu-catering-careers, frontend/rewards-staff-admin, frontend/public-pages, backend/rewards-auth-infra ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore NooshApp.slnx

      - name: Build
        run: dotnet build NooshApp.slnx --no-restore --configuration Release
